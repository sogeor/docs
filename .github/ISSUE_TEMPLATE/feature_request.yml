name: Documentation request
description: Propose a new page, guide, runbook, ADR or site improvement.
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: Check the [roadmap](https://github.com/sogeor/docs/blob/master/ROADMAP.md) first.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What you cannot find or understand today and why it matters.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What page or change you expect, and for whom.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
