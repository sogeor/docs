name: docs

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docs:
    uses: sogeor/workflows/.github/workflows/docs.yml@7d7cabb75c9c2116cb2a669d65f23609f1504660 # v0.1.1
    with:
      link-args: >-
        --exclude-path docs/repos
        --exclude '^https://github\.com/sogeor/[^/]+/(security|issues/new)'
        --exclude '^https://docs\.sogeor\.com'
        --exclude '^https?://127\.0\.0\.1'

  site:
    name: site
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install dependencies
        run: python3 -m pip install --user --quiet --require-hashes -r .github/requirements-docs.txt

      - name: Aggregate repository docs
        run: python3 tools/aggregate.py

      - name: mkdocs build --strict
        run: python3 -m mkdocs build --strict -f mkdocs.generated.yml --site-dir "$RUNNER_TEMP/site"
