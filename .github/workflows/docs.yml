name: docs

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docs:
    name: docs
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: markdownlint
        uses: DavidAnson/markdownlint-cli2-action@21c1be1b93ad9ed58fa840aacc3f279cde2a72ff # v24.2.0
        with:
          globs: |
            *.md
            docs/**/*.md
            .github/**/*.md

      - name: lychee
        env:
          GITHUB_TOKEN: ${{ github.token }}
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: >-
            --no-progress
            --exclude-path docs/repos
            --exclude '^https://github\.com/sogeor/[^/]+/(security|issues/new)'
            --exclude '^https://sogeor\.github\.io/docs'
            --exclude '^https?://127\.0\.0\.1'
            '*.md' 'docs/**/*.md' '.github/**/*.md'
          fail: true

      - name: Install dependencies
        run: python3 -m pip install --user --quiet --require-hashes -r .github/requirements-docs.txt

      - name: Aggregate repository docs
        run: python3 tools/aggregate.py

      - name: mkdocs build --strict
        run: python3 -m mkdocs build --strict -f mkdocs.generated.yml --site-dir "$RUNNER_TEMP/site"
