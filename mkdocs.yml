site_name: sogeor platform
site_description: Documentation of the sogeor DevSecOps platform
site_url: https://sogeor.github.io/docs/
repo_url: https://github.com/sogeor/docs
repo_name: sogeor/docs
copyright: Copyright &copy; sogeor. Licensed under Apache-2.0.
strict: true

theme:
  name: material
  features:
    - content.code.copy
    - navigation.indexes
    - navigation.sections
    - navigation.tabs
    - navigation.top
    - search.highlight
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

validation:
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn
  anchors: warn

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

nav:
  - Home: index.md
  - Platform:
      - Overview: platform-overview.md
      - Principles: principles.md
      - Cluster constructor: constructor.md
      - Deploy everything: deploy-everything.md
      - Network: network.md
      - Security: security.md
      - Compliance: compliance.md
      - Capacity: capacity.md
  - Decisions:
      - adr/index.md
      - "0001 Aggregate repository docs via CI copy": adr/0001-aggregate-repository-docs-via-ci-copy.md
